<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Futebol de Desafios</title>

<style>
body {
  margin: 0;
  background: #1c1c1c;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  overflow: hidden;
}

h1 {
  margin: 10px;
}

#hud {
  display: flex;
  justify-content: center;
  gap: 40px;
  margin-bottom: 10px;
  font-size: 20px;
}

canvas {
  background: #2e8b57;
  border: 4px solid white;
  border-radius: 10px;
}

#mission {
  margin-top: 10px;
  color: #ffe066;
  font-size: 22px;
}

#controls {
  margin-top: 10px;
  color: #ddd;
}
</style>
</head>
<body>

<h1>⚽ Futebol de Desafios ⚽</h1>

<div id="hud">
  <div>🔵 Seus Pontos: <span id="score">0</span></div>
  <div>🔴 Pontos do Adversário: <span id="enemyScore">0</span></div>
  <div>⏱️ Tempo: <span id="timer">30</span>s</div>
</div>

<canvas id="game" width="1200" height="700"></canvas>

<div id="mission"></div>

<div id="controls">
  Use WASD ou SETAS para mover.<br>
  Pressione F para PASSAR e G para CHUTAR ao gol.
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const scoreEl = document.getElementById('score');
const enemyScoreEl = document.getElementById('enemyScore');
const timerEl = document.getElementById('timer');
const missionEl = document.getElementById('mission');

let score = 0;
let enemyScore = 0;
let timer = 30;
let passes = 0;

const missions = [
  {
    text: '⚽ Faça um gol em menos de 30 segundos!',
    check: () => timer > 0
  },
  {
    text: '🤝 Faça 2 passes antes do gol!',
    check: () => passes >= 2
  },
  {
    text: '🔥 Faça um gol sem perder a bola!',
    check: () => true
  },
  {
    text: '🚀 Faça um gol de longe!',
    check: () => player.x < 500
  },
  {
    text: '🎯 Marque o gol com chute direto!',
    check: () => passes === 0
  },
  {
    text: '⚡ Faça o gol em menos de 15 segundos!',
    check: () => timer > 15
  },
  {
    text: '🧠 Faça 3 passes antes do gol!',
    check: () => passes >= 3
  }
];

let currentMission = 0;
missionEl.innerText = missions[currentMission].text;

const player = {
  x: 120,
  y: 350,
  radius: 18,
  color: 'blue',
  speed: 5
};

const teammates = [
  { x: 350, y: 150, radius: 15, color: 'cyan' },
  { x: 500, y: 550, radius: 15, color: 'cyan' },
  { x: 650, y: 350, radius: 15, color: 'cyan' }
];

const enemies = [
  { x: 850, y: 120, radius: 18, color: 'red', speed: 3 },
  { x: 950, y: 250, radius: 18, color: 'red', speed: 3.2 },
  { x: 900, y: 450, radius: 18, color: 'red', speed: 3 },
  { x: 1050, y: 600, radius: 18, color: 'red', speed: 3.3 }
];

const ball = {
  x: player.x + 25,
  y: player.y,
  radius: 10,
  dx: 0,
  dy: 0,
  attached: true,
  owner: 'player'
};

const goal = {
  x: 1130,
  y: 250,
  width: 40,
  height: 180
};

const enemyGoal = {
  x: 30,
  y: 250,
  width: 40,
  height: 180
};

const keys = {};

window.addEventListener('keydown', (e) => {
  keys[e.key.toLowerCase()] = true;

  // Passe
  if (e.key.toLowerCase() === 'f') {
    passBall();
  }

  // Chute
  if (e.key.toLowerCase() === 'g') {
    shootBall();
  }
});

window.addEventListener('keyup', (e) => {
  keys[e.key.toLowerCase()] = false;
});

function drawField() {
  ctx.fillStyle = '#2e8b57';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = 'white';
  ctx.lineWidth = 4;

  ctx.strokeRect(0, 0, canvas.width, canvas.height);

  // Linha do meio
  ctx.beginPath();
  ctx.moveTo(canvas.width / 2, 0);
  ctx.lineTo(canvas.width / 2, canvas.height);
  ctx.stroke();

  // Círculo central
  ctx.beginPath();
  ctx.arc(canvas.width / 2, canvas.height / 2, 80, 0, Math.PI * 2);
  ctx.stroke();

  // Área dos gols
  ctx.strokeRect(goal.x - 100, goal.y - 50, 100, goal.height + 100);
  ctx.strokeRect(enemyGoal.x, enemyGoal.y - 50, 100, enemyGoal.height + 100);

  // Gols
  ctx.fillStyle = 'white';
  ctx.fillRect(goal.x, goal.y, goal.width, goal.height);
  ctx.fillRect(enemyGoal.x, enemyGoal.y, enemyGoal.width, enemyGoal.height);
}

function drawCircle(obj) {
  ctx.beginPath();
  ctx.arc(obj.x, obj.y, obj.radius, 0, Math.PI * 2);
  ctx.fillStyle = obj.color;
  ctx.fill();
  ctx.closePath();

  // Indicador de posse
  if (ball.owner === 'player' && obj === player) {
    ctx.beginPath();
    ctx.arc(obj.x, obj.y - 28, 8, 0, Math.PI * 2);
    ctx.fillStyle = 'yellow';
    ctx.fill();
    ctx.closePath();
  }

  enemies.forEach((enemy, index) => {
    if (ball.owner === index && obj === enemy) {
      ctx.beginPath();
      ctx.arc(enemy.x, enemy.y - 28, 8, 0, Math.PI * 2);
      ctx.fillStyle = 'yellow';
      ctx.fill();
      ctx.closePath();

      ctx.beginPath();
      ctx.arc(enemy.x + 16, enemy.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = 'white';
      ctx.fill();
      ctx.strokeStyle = 'black';
      ctx.stroke();
      ctx.closePath();
    }
  });
}

function movePlayer() {
  if (keys['w'] || keys['arrowup']) player.y -= player.speed;
  if (keys['s'] || keys['arrowdown']) player.y += player.speed;
  if (keys['a'] || keys['arrowleft']) player.x -= player.speed;
  if (keys['d'] || keys['arrowright']) player.x += player.speed;

  player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
  player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

  if (ball.owner === 'player') {
    ball.x = player.x + 25;
    ball.y = player.y;
  }
}

function moveEnemies() {
  enemies.forEach((enemy, index) => {

    let targetX = ball.x;
    let targetY = ball.y;

    // Se o inimigo tem a bola
    if (ball.owner === index) {
      targetX = enemyGoal.x;
      targetY = enemyGoal.y + enemyGoal.height / 2;

      ball.x = enemy.x + 16;
      ball.y = enemy.y;
    }

    const angle = Math.atan2(targetY - enemy.y, targetX - enemy.x);

    enemy.x += Math.cos(angle) * enemy.speed;
    enemy.y += Math.sin(angle) * enemy.speed;

    // Roubo da bola
    const distBall = Math.hypot(ball.x - enemy.x, ball.y - enemy.y);

    if (distBall < enemy.radius + ball.radius && ball.owner === 'player') {
      ball.owner = index;
      ball.attached = false;
    }

    // Jogador recupera a bola
    const distPlayerEnemy = Math.hypot(player.x - enemy.x, player.y - enemy.y);

    if (distPlayerEnemy < player.radius + enemy.radius && ball.owner === index) {
      ball.owner = 'player';
      ball.attached = true;
    }

    // Chute do inimigo
    if (ball.owner === index && enemy.x < 180) {
      const angleGoal = Math.atan2(
        enemyGoal.y + enemyGoal.height / 2 - enemy.y,
        enemyGoal.x - enemy.x
      );

      ball.dx = Math.cos(angleGoal) * 8;
      ball.dy = Math.sin(angleGoal) * 8;

      ball.owner = null;
      ball.attached = false;
    }
  });
}

function moveTeammates() {
  teammates.forEach((mate, index) => {
    const targetX = 350 + (index * 180) + Math.sin(Date.now() * 0.001 + index) * 100;
    const targetY = 200 + (index * 120) + Math.cos(Date.now() * 0.0015 + index) * 80;

    mate.x += (targetX - mate.x) * 0.02;
    mate.y += (targetY - mate.y) * 0.02;
  });
}

function passBall() {
  // Só passa se o jogador estiver com a bola
  if (ball.owner !== 'player') return;

  let nearestMate = null;
  let nearestDist = Infinity;

  // Procurar companheiro mais próximo
  teammates.forEach(mate => {
    const dist = Math.hypot(player.x - mate.x, player.y - mate.y);

    if (dist < nearestDist && dist < 320) {
      nearestDist = dist;
      nearestMate = mate;
    }
  });

  // Se encontrou companheiro
  if (nearestMate) {
    ball.attached = false;
    ball.owner = null;

    const angle = Math.atan2(
      nearestMate.y - ball.y,
      nearestMate.x - ball.x
    );

    // Passe mais forte e preciso
    ball.dx = Math.cos(angle) * 9;
    ball.dy = Math.sin(angle) * 9;

    passes++;
  }
}

function shootBall() {
  if (ball.owner !== 'player') return;

  ball.attached = false;
  ball.owner = null;

  // Chute forte em direção ao gol
  const angleGoal = Math.atan2(
    goal.y + goal.height / 2 - player.y,
    goal.x - player.x
  );

  ball.dx = Math.cos(angleGoal) * 12;
  ball.dy = Math.sin(angleGoal) * 12;
}

function updateBall() {
  if (ball.owner === 'player') return;

  if (typeof ball.owner === 'number') return;

  ball.x += ball.dx;
  ball.y += ball.dy;

  ball.dx *= 0.99;
  ball.dy *= 0.99;

  // Companheiro recebe o passe
  teammates.forEach(mate => {
    const dist = Math.hypot(ball.x - mate.x, ball.y - mate.y);

    // Apenas recebe se a bola estiver livre
    if (
      dist < mate.radius + ball.radius &&
      ball.owner === null
    ) {
      // Jogador assume posição do companheiro para continuar a jogada
      player.x = mate.x;
      player.y = mate.y;

      ball.owner = 'player';
      ball.attached = true;
      ball.dx = 0;
      ball.dy = 0;
    }
  });

  // Fora do campo
  if (
    ball.x < 0 ||
    ball.x > canvas.width ||
    ball.y < 0 ||
    ball.y > canvas.height
  ) {
    resetBall();
  }

  // Gol do jogador
  if (
    ball.x > goal.x &&
    ball.y > goal.y &&
    ball.y < goal.y + goal.height
  ) {
    scoreGoal();
  }

  // Gol inimigo
  if (
    ball.x < enemyGoal.x + enemyGoal.width &&
    ball.y > enemyGoal.y &&
    ball.y < enemyGoal.y + enemyGoal.height
  ) {
    enemyScoreGoal();
  }
}

function resetBall() {
  ball.owner = 'player';
  ball.attached = true;
  ball.dx = 0;
  ball.dy = 0;
  ball.x = player.x + 25;
  ball.y = player.y;
}

function enemyScoreGoal() {
  enemyScore++;
  enemyScoreEl.innerText = enemyScore;

  alert('🔴 O time vermelho marcou um gol!');

  timer = 30;
  passes = 0;

  player.x = 120;
  player.y = 350;

  resetBall();
}

function scoreGoal() {
  let valid = false;

  valid = missions[currentMission].check();

  if (valid) {
    score += 10;
    alert('⚽ GOOOL! Missão completada!');
  } else {
    alert('❌ Gol feito, mas a missão falhou!');
  }

  scoreEl.innerText = score;

  currentMission++;

  if (currentMission >= missions.length) {
    currentMission = 0;
    alert('🏆 Você completou todas as missões!');
  }

  missionEl.innerText = missions[currentMission].text;

  passes = 0;
  timer = 30;

  resetBall();
}

function updateTimer() {
  timer--;
  timerEl.innerText = timer;

  if (timer <= 0) {
    alert('⏰ Tempo esgotado!');
    timer = 30;
    resetBall();
  }
}

setInterval(updateTimer, 1000);

function gameLoop() {
  drawField();

  movePlayer();
  moveEnemies();
  moveTeammates();
  updateBall();

  drawCircle(player);
  teammates.forEach(drawCircle);
  enemies.forEach(drawCircle);

  // Desenhar bola livre
  if (ball.owner === null) {
    drawCircle({
      x: ball.x,
      y: ball.y,
      radius: ball.radius,
      color: 'white'
    });
  }

  requestAnimationFrame(gameLoop);
}

resetBall();
gameLoop();
</script>

</body>
</html>
