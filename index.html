<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>TableKick Melhorado</title>

<style>
body{
  margin:0;
  background:#1c1c1c;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  overflow:hidden;
}

h1{
  margin:10px;
}

#hud{
  display:flex;
  justify-content:center;
  gap:40px;
  margin-bottom:10px;
  font-size:20px;
}

canvas{
  background:#2e8b57;
  border:4px solid white;
  border-radius:10px;
}

#mission{
  margin-top:10px;
  color:#ffe066;
  font-size:22px;
}

#controls{
  margin-top:10px;
  color:#ddd;
}

#powerContainer{
  width:300px;
  height:20px;
  background:#444;
  margin:10px auto;
  border-radius:10px;
  overflow:hidden;
  border:2px solid white;
}

#powerBar{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#00ff88,#ffee00,#ff3300);
}
</style>
</head>

<body>

<h1>⚽ TableKick Melhorado ⚽</h1>

<div id="hud">
  <div>🔵 Seus Pontos: <span id="score">0</span></div>
  <div>🔴 Pontos do Adversário: <span id="enemyScore">0</span></div>
  <div>⏱️ Tempo: <span id="timer">30</span>s</div>
</div>

<canvas id="game" width="1200" height="700"></canvas>

<div id="powerContainer">
  <div id="powerBar"></div>
</div>

<div id="mission"></div>

<div id="controls">
  WASD / SETAS = mover |
  F = passe |
  SEGURE G = chute forte
  <p>Autor Marcio Barbosa</p>
</div>

<script>

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const scoreEl = document.getElementById('score');
const enemyScoreEl = document.getElementById('enemyScore');
const timerEl = document.getElementById('timer');
const missionEl = document.getElementById('mission');
const powerBar = document.getElementById('powerBar');

let score = 0;
let enemyScore = 0;
let timer = 30;
let passes = 0;

let chargingShot = false;
let shotPower = 0;
let lastTime = 0;

const missions = [
{
  text:'⚽ Faça um gol em menos de 30 segundos!',
  check:() => timer > 0
},
{
  text:'🤝 Faça 2 passes antes do gol!',
  check:() => passes >= 2
},
{
  text:'🚀 Faça um gol de longe!',
  check:() => player.x < 500
},
{
  text:'🎯 Faça um gol sem passes!',
  check:() => passes === 0
}
];

let currentMission = 0;
missionEl.innerText = missions[currentMission].text;

const player = {
  x:120,
  y:350,
  radius:18,
  color:'blue',
  speed:320
};

const teammates = [
{ x:350,y:150,radius:15,color:'cyan' },
{ x:500,y:550,radius:15,color:'cyan' },
{ x:650,y:350,radius:15,color:'cyan' }
];

const enemies = [
{ x:850,y:120,radius:18,color:'red',speed:170 },
{ x:950,y:250,radius:18,color:'red',speed:180 },
{ x:900,y:450,radius:18,color:'red',speed:170 },
{ x:1050,y:600,radius:18,color:'red',speed:190 }
];

const ball = {
  x:0,
  y:0,
  radius:10,
  dx:0,
  dy:0,
  owner:'player'
};

const goal = {
  x:1130,
  y:250,
  width:40,
  height:180
};

const enemyGoal = {
  x:30,
  y:250,
  width:40,
  height:180
};

const keys = {};

window.addEventListener('keydown',(e)=>{

  keys[e.key.toLowerCase()] = true;

  if(e.key.toLowerCase()==='f'){
    passBall();
  }

  if(e.key.toLowerCase()==='g'){
    chargingShot = true;
  }

});

window.addEventListener('keyup',(e)=>{

  keys[e.key.toLowerCase()] = false;

  if(e.key.toLowerCase()==='g'){

    chargingShot = false;

    shootBall(shotPower);

    shotPower = 0;
    powerBar.style.width = '0%';
  }

});

function drawField(){

  ctx.fillStyle = '#2e8b57';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.strokeStyle='white';
  ctx.lineWidth=4;

  ctx.strokeRect(0,0,canvas.width,canvas.height);

  ctx.beginPath();
  ctx.moveTo(canvas.width/2,0);
  ctx.lineTo(canvas.width/2,canvas.height);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(canvas.width/2,canvas.height/2,80,0,Math.PI*2);
  ctx.stroke();

  ctx.strokeRect(goal.x-100,goal.y-50,100,goal.height+100);
  ctx.strokeRect(enemyGoal.x,enemyGoal.y-50,100,goal.height+100);

  ctx.fillRect(goal.x,goal.y,goal.width,goal.height);
  ctx.fillRect(enemyGoal.x,enemyGoal.y,enemyGoal.width,enemyGoal.height);
}

function drawCircle(obj){

  ctx.beginPath();

  ctx.arc(obj.x,obj.y,obj.radius,0,Math.PI*2);

  ctx.fillStyle=obj.color;
  ctx.fill();

  ctx.closePath();
}

function drawBall(){

  ctx.beginPath();

  ctx.arc(ball.x,ball.y,ball.radius,0,Math.PI*2);

  ctx.fillStyle='white';
  ctx.fill();

  ctx.strokeStyle='black';
  ctx.stroke();

  ctx.closePath();

  // sombra
  ctx.beginPath();

  ctx.arc(ball.x+4,ball.y+4,ball.radius,0,Math.PI*2);

  ctx.fillStyle='rgba(0,0,0,0.2)';
  ctx.fill();
}

function movePlayer(dt){

  const move = player.speed * dt;

  if(keys['w'] || keys['arrowup']) player.y -= move;
  if(keys['s'] || keys['arrowdown']) player.y += move;
  if(keys['a'] || keys['arrowleft']) player.x -= move;
  if(keys['d'] || keys['arrowright']) player.x += move;

  player.x = Math.max(player.radius,
  Math.min(canvas.width-player.radius,player.x));

  player.y = Math.max(player.radius,
  Math.min(canvas.height-player.radius,player.y));

  if(ball.owner === 'player'){

    ball.x = player.x + 22;
    ball.y = player.y;
  }
}

function moveEnemies(dt){

  enemies.forEach((enemy,index)=>{

    let targetX = ball.x;
    let targetY = ball.y;

    const formationX = 750 + (index*90);
    const formationY = 160 + (index*130);

    if(ball.owner === index){

      targetX = enemyGoal.x;
      targetY = enemyGoal.y + enemyGoal.height/2;

      ball.x = enemy.x - 20;
      ball.y = enemy.y;

    }else{

      let closestEnemy = enemies[0];
      let closestDist = Infinity;

      enemies.forEach(e=>{

        const d = Math.hypot(ball.x-e.x,ball.y-e.y);

        if(d < closestDist){

          closestDist = d;
          closestEnemy = e;
        }
      });

      if(enemy === closestEnemy){

        targetX = ball.x;
        targetY = ball.y;

      }else{

        targetX = formationX +
        Math.sin(Date.now()*0.001+index)*40;

        targetY = formationY +
        Math.cos(Date.now()*0.0015+index)*40;
      }
    }

    const angle = Math.atan2(
      targetY-enemy.y,
      targetX-enemy.x
    );

    enemy.x += Math.cos(angle)*enemy.speed*dt;
    enemy.y += Math.sin(angle)*enemy.speed*dt;

    enemy.x = Math.max(enemy.radius,
    Math.min(canvas.width-enemy.radius,enemy.x));

    enemy.y = Math.max(enemy.radius,
    Math.min(canvas.height-enemy.radius,enemy.y));

    const distBall = Math.hypot(
      ball.x-enemy.x,
      ball.y-enemy.y
    );

    if(
      distBall < enemy.radius + ball.radius &&
      ball.owner === 'player'
    ){
      ball.owner = index;
    }

    const distPlayerEnemy = Math.hypot(
      player.x-enemy.x,
      player.y-enemy.y
    );

    if(
      distPlayerEnemy < player.radius+enemy.radius &&
      ball.owner === index
    ){
      ball.owner='player';
    }

    // chute IA
    if(ball.owner === index){

      const distGoal = Math.hypot(
        enemy.x-enemyGoal.x,
        enemy.y-(enemyGoal.y+enemyGoal.height/2)
      );

      if(distGoal < 220){

        ball.owner = null;

        const angleGoal = Math.atan2(
          enemyGoal.y+enemyGoal.height/2-enemy.y,
          enemyGoal.x-enemy.x
        );

        ball.dx = Math.cos(angleGoal)*12;
        ball.dy = Math.sin(angleGoal)*12;
      }
    }

  });
}

function moveTeammates(dt){

  teammates.forEach((mate,index)=>{

    const targetX =
      350 + index*180 +
      Math.sin(Date.now()*0.001+index)*100;

    const targetY =
      200 + index*120 +
      Math.cos(Date.now()*0.0015+index)*80;

    mate.x += (targetX-mate.x)*0.02;
    mate.y += (targetY-mate.y)*0.02;
  });
}

function passBall(){

  if(ball.owner !== 'player') return;

  let nearestMate = null;
  let nearestDist = Infinity;

  teammates.forEach(mate=>{

    const dist = Math.hypot(
      player.x-mate.x,
      player.y-mate.y
    );

    if(dist < nearestDist && dist < 350){

      nearestDist = dist;
      nearestMate = mate;
    }
  });

  if(nearestMate){

    ball.owner = null;

    const angle = Math.atan2(
      nearestMate.y-ball.y,
      nearestMate.x-ball.x
    );

    ball.dx = Math.cos(angle)*9;
    ball.dy = Math.sin(angle)*9;

    passes++;
  }
}

function shootBall(power=12){

  if(ball.owner !== 'player') return;

  ball.owner = null;

  const angleGoal = Math.atan2(
    goal.y + goal.height/2 - player.y,
    goal.x - player.x
  );

  const force = Math.max(8,power);

  ball.dx = Math.cos(angleGoal)*force;
  ball.dy = Math.sin(angleGoal)*force;
}

function updateBall(dt){

  if(ball.owner === 'player') return;
  if(typeof ball.owner === 'number') return;

  ball.x += ball.dx;
  ball.y += ball.dy;

  ball.dx *= 0.99;
  ball.dy *= 0.99;

  // rastro
  ctx.beginPath();
  ctx.arc(ball.x,ball.y,4,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.3)';
  ctx.fill();

  const distPlayerBall = Math.hypot(
    player.x-ball.x,
    player.y-ball.y
  );

  if(
    distPlayerBall < player.radius+ball.radius &&
    ball.owner === null
  ){
    ball.owner='player';
    ball.dx=0;
    ball.dy=0;
  }

  enemies.forEach((enemy,index)=>{

    const dist = Math.hypot(
      enemy.x-ball.x,
      enemy.y-ball.y
    );

    if(
      dist < enemy.radius+ball.radius &&
      ball.owner === null
    ){
      ball.owner=index;
      ball.dx=0;
      ball.dy=0;
    }
  });

  teammates.forEach(mate=>{

    const dist = Math.hypot(
      mate.x-ball.x,
      mate.y-ball.y
    );

    if(dist < mate.radius+ball.radius){

      ball.owner='player';
      ball.dx=0;
      ball.dy=0;
    }
  });

  if(
    ball.x < 0 ||
    ball.x > canvas.width ||
    ball.y < 0 ||
    ball.y > canvas.height
  ){
    resetBall();
  }

  if(
    ball.x > goal.x &&
    ball.y > goal.y &&
    ball.y < goal.y + goal.height
  ){
    scoreGoal();
  }

  if(
    ball.x < enemyGoal.x + enemyGoal.width &&
    ball.y > enemyGoal.y &&
    ball.y < enemyGoal.y + enemyGoal.height
  ){
    enemyScoreGoal();
  }
}

function resetBall(){

  player.x = 120;
  player.y = 350;

  ball.x = player.x + 25;
  ball.y = player.y;

  ball.dx = 0;
  ball.dy = 0;

  ball.owner='player';
}

function enemyScoreGoal(){

  enemyScore++;

  enemyScoreEl.innerText = enemyScore;

  alert('🔴 Gol do time vermelho!');

  timer = 30;
  passes = 0;

  resetBall();
}

function scoreGoal(){

  const valid = missions[currentMission].check();

  if(valid){

    score++;

    alert('⚽ GOOOL! Missão completada!');

  }else{

    alert('❌ Gol sem completar missão!');
  }

  scoreEl.innerText = score;

  currentMission++;

  if(currentMission >= missions.length){
    currentMission = 0;
  }

  missionEl.innerText =
  missions[currentMission].text;

  timer = 30;
  passes = 0;

  resetBall();
}

function updateTimer(){

  if(timer > 0){
    timer--;
  }

  timerEl.innerText = timer;

  if(timer <= 0){

    alert('⏰ Tempo esgotado!');

    timer = 30;
    passes = 0;

    resetBall();
  }
}

setInterval(updateTimer,1000);

function updateShotPower(dt){

  if(chargingShot){

    shotPower += 30 * dt;

    if(shotPower > 25){
      shotPower = 25;
    }

    powerBar.style.width =
    (shotPower / 25) * 100 + '%';
  }
}

function gameLoop(timestamp){

  const dt = (timestamp-lastTime)/1000;
  lastTime = timestamp;

  drawField();

  updateShotPower(dt);

  movePlayer(dt);
  moveEnemies(dt);
  moveTeammates(dt);
  updateBall(dt);

  drawCircle(player);

  teammates.forEach(drawCircle);
  enemies.forEach(drawCircle);

  drawBall();

  requestAnimationFrame(gameLoop);
}

resetBall();

requestAnimationFrame(gameLoop);

</script>

</body>
</html>
